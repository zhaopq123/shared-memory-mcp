[project]
name = "shared-memory-mcp"
version = "0.1.0"
description = "跨 agent 共享的长期记忆 MCP 服务：文件型 vault + git 版本化 + 单写者 FIFO 队列"
requires-python = ">=3.10"
dependencies = [
    # 版本与目标机上已验证的 social-insight-mcp 保持一致，
    # 避免「在我机器上能跑」的问题
    "fastmcp==4.1.0",
    "uvicorn==0.54.0",
    "starlette==1.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# 静态资源必须随包一起装 —— 否则面板会 500（找不到 panel.css/js）。
# setuptools 默认只收 .py，要显式声明。
[tool.setuptools.package-data]
shared_memory = ["static/*.css", "static/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
